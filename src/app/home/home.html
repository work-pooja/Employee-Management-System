<div class="min-h-screen bg-slate-100 px-4 py-10">
  <div class="mx-auto max-w-6xl rounded-2xl bg-white p-6 shadow-lg ring-1 ring-slate-200">
    <div class="mb-6 flex items-center justify-between gap-4">
      <h2 class="text-3xl font-semibold text-slate-800">Employee List</h2>
      <button
        type="button"
        routerLink="/add-employee"
        class="inline-flex items-center justify-center rounded-lg bg-black px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-slate-800"
      >
        Add Employee
      </button>
    </div>
    @if (dataSource) {
    <div class="overflow-x-auto rounded-xl border border-slate-200">
      <table mat-table [dataSource]="dataSource" class="w-full border-collapse bg-white">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef
            class="bg-black px-4 py-3 text-left text-sm font-semibold text-slate-700">ID</th>
          <td mat-cell *matCellDef="let employee" class="border-b border-slate-200 bg-white px-4 py-3 text-slate-700">{{
            employee.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef
            class="bg-black px-4 py-3 text-left text-sm font-semibold text-slate-700">Name</th>
          <td mat-cell *matCellDef="let employee" class="border-b border-slate-200 bg-white px-4 py-3 text-slate-700">{{
            employee.name }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef
            class="bg-black px-4 py-3 text-left text-sm font-semibold text-slate-700">Role</th>
          <td mat-cell *matCellDef="let employee" class="border-b border-slate-200 bg-white px-4 py-3 text-slate-700">{{
            employee.role }}</td>
        </ng-container>

        <ng-container matColumnDef="age">
          <th mat-header-cell *matHeaderCellDef
            class="bg-black px-4 py-3 text-left text-sm font-semibold text-slate-700">Age</th>
          <td mat-cell *matCellDef="let employee" class="border-b border-slate-200 bg-white px-4 py-3 text-slate-700">{{
            employee.age }}</td>
        </ng-container>

        <ng-container matColumnDef="projects">
          <th mat-header-cell *matHeaderCellDef
            class="bg-black px-4 py-3 text-left text-sm font-semibold text-slate-700">Projects</th>
          <td mat-cell *matCellDef="let employee" class="border-b border-slate-200 bg-white px-4 py-3 text-slate-700">{{
            employee.projects.join(', ') }}</td>
        </ng-container>       
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="bg-black px-4 py-3 text-left text-sm font-semibold text-slate-700">Actions</th>
          <td mat-cell *matCellDef="let employee" class="border-b border-slate-200 bg-white px-4 py-3 text-slate-700">
            <button type="button" (click)="edit(employee)" class="mr-2 text-blue-600 hover:text-blue-800" aria-label="Edit employee">
              <mat-icon>edit</mat-icon>
            </button>
            <button type="button" (click)="delete(employee.id)" class="text-red-600 hover:text-red-800" aria-label="Delete employee">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50"></tr>
      </table>
    </div>
    }
  </div>
</div>
